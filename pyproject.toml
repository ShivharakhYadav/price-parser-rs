[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# Deliberately the same import name as the upstream package: the vendored
# original tests do `from price_parser import Price`, and they run unmodified.
name = "price-parser"
version = "0.1.0"
description = "Extract price amount and currency from a raw text string (Rust port)."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/ShivharakhYadav/price-parser-rs"
Source = "https://github.com/ShivharakhYadav/price-parser-rs"

[tool.maturin]
module-name = "price_parser"
features = ["pyo3/extension-module", "python"]

# Ship PEP 561 type information, as upstream does.
#
# The implementation is Rust, so there are no inline annotations for a type
# checker to read, and without these a drop-in replacement would silently lose
# the typing upstream's py.typed package provides.
#
# Added via `include` rather than by switching maturin to a mixed layout. A
# mixed layout would replace maturin's generated __init__.py shim with one of
# ours, changing how the module is imported -- and the vendored suite depends
# on that import working exactly as it does now. `include` preserves the source
# path, so price_parser/ here lands as price_parser/ in the wheel, leaving the
# generated shim untouched. The directory holds no __init__.py precisely so
# maturin does not mistake it for a mixed-layout package.
include = [
    { path = "price_parser/__init__.pyi", format = "wheel" },
    { path = "price_parser/py.typed", format = "wheel" },
]

[tool.pytest.ini_options]
# tests/original holds the upstream suite, byte-for-byte and never edited. It
# runs against the Rust implementation through the extension module, which is
# the whole point of the port. tests/python covers the binding itself.
testpaths = ["tests/python", "tests/original"]
